name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint + format check
        run: npx biome ci .

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: jsr.json and package.json versions match
        run: node -e 'const a=require("./package.json").version,b=require("./jsr.json").version;if(a!==b){console.error(`package.json ${a} != jsr.json ${b}`);process.exit(1)}'
