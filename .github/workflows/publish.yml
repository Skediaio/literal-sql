name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      # Skip when this version is already on npm (every push to main runs this).
      - name: Publish to npm
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "@skedia/literal-sql@$VERSION" version >/dev/null 2>&1; then
            echo "npm: $VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi

      - name: Publish to JSR
        run: npx jsr publish
